[package]
name = "rustpin"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
